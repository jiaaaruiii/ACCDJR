<style>
/* Neutral grey ground so the four ideology hues are the only colours.
   Layout: a section through Revachol. Districts run across (schematic, west to east of the river), eras run down (street level at the top).
   Surface shows two things only: each character's ideology (coloured dot) and the era's ruling ideology (bar across the top of each band, filled cells where the sources single out a district). Everything else lives in the hover tip and the side panel. */
:root {
  --sea: #262626;
  --sea-2: #2e2e2e;
  --sea-3: #3a3a3a;
  --edge: #232323;
  --line: #4a4a4a;
  --line-soft: #363636;
  --fg: #e6e6e6;
  --muted: #9c9c9c;
  --neutral-hl: #b4b4b4;
  --river: #34464c;
  --display: "Spectral SC", "Noto Serif SC", Georgia, serif;
  --body: "Spectral", "Noto Serif SC", Georgia, serif;
  --mono: "IBM Plex Mono", "Noto Serif SC", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html[lang="zh"] { --display: "Noto Serif SC", "Spectral SC", serif; --body: "Noto Serif SC", "Spectral", serif; }
body { background: var(--sea); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6; }
a { color: var(--fg); text-decoration-color: var(--muted); text-underline-offset: 2px; }
a:hover { text-decoration-color: var(--fg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
[hidden] { display: none !important; }
.unv { color: var(--muted); font-family: var(--mono); font-size: .8em; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; flex: none; }
.small { font-size: 13px; color: var(--muted); }

.wrap { padding-inline: 20px; padding-block: 18px 32px; display: flex; flex-direction: column; gap: 20px; max-width: 1720px; margin: 0 auto; }

.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 24px; align-items: start; }
.top h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(26px, 3.4vw, 40px); letter-spacing: .03em; line-height: 1.1; text-wrap: balance; }
.lede { margin: 6px 0 0; max-width: 70ch; }
.lang { display: inline-flex; justify-self: start; border: 1px solid var(--line); background: var(--sea); }
.lang button { font: 500 12px/1 var(--mono); color: var(--muted); background: transparent; border: 0; padding: 8px 11px; cursor: pointer; letter-spacing: .04em; }
.lang button[aria-pressed="true"] { color: var(--sea); background: var(--fg); }
.gloss { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.g { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 2px 8px; align-items: start; min-width: 0; }
.g i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); margin-top: 4px; }
.g b { font-family: var(--display); font-weight: 700; letter-spacing: .03em; font-size: 15px; }
.g span { grid-column: 2; font-size: 13px; color: var(--muted); line-height: 1.5; }
.howto { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13.5px; color: var(--muted); align-items: center; }
.howto .k { display: inline-flex; align-items: center; gap: 8px; }
.howto label.k { cursor: pointer; color: var(--fg); }
.howto input { width: 15px; height: 15px; margin: 0; accent-color: #9c9c9c; }
.sw { width: 26px; height: 16px; border: 1px solid var(--line); display: inline-block; background: var(--sea-2); position: relative; }
.sw.bar::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--bar); }
.pip { width: 12px; height: 12px; border-radius: 50%; display: inline-block; background: var(--c); }

.work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(290px, 360px); gap: 18px; align-items: start; }
.scroll { overflow-x: auto; border: 1px solid var(--line); background: var(--sea-2); min-width: 0; }
.sheet { position: relative; min-width: 900px; }
.grid { display: grid; }
.colhead { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 10px 8px 8px; display: flex; flex-direction: column; justify-content: flex-end; line-height: 1.3; border-bottom: 1px solid var(--line); }
.colhead .side { font-family: var(--display); font-size: 11px; letter-spacing: .12em; }
.colhead.edge { background: var(--edge); font-style: italic; }
.colhead.mart { color: var(--fg); }
.colhead.river { background: var(--river); padding: 0; }
.axis { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 10px; display: flex; align-items: flex-end; border-bottom: 1px solid var(--line); }
.rowhead { padding: 14px 10px 10px; border: 0; border-bottom: 1px solid var(--line-soft); background: transparent; display: flex; flex-direction: column; gap: 2px; cursor: pointer; text-align: left; }
.rowhead .rn { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .03em; line-height: 1.25; }
.rowhead .rw { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.rowhead:hover .rn { text-decoration: underline; text-decoration-color: var(--muted); }
.rowhead.cur { background: var(--sea-3); }
.cell { position: relative; border-bottom: 1px solid var(--line-soft); padding: 16px 8px 12px; min-height: 64px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; cursor: pointer; }
.cell.bar::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--bar); }
.cell.edge { background: var(--edge); }
.cell.river { background: var(--river); cursor: default; padding: 0; }
.cell.gone { background: #1d1d1d; }
.cell:not(.river):hover { box-shadow: inset 0 0 0 1px var(--line); }
.cell.cur { box-shadow: inset 0 0 0 2px var(--hl); }
.cell.cur.relicsel { box-shadow: inset 0 0 0 2px var(--neutral-hl); }

.pt { width: 30px; height: 30px; border-radius: 50%; background: var(--c); border: 2.5px solid var(--c); padding: 0; cursor: pointer; flex: none; overflow: hidden; transition: opacity .15s, transform .15s; }
.pt.npc { width: 24px; height: 24px; border-width: 2px; opacity: .85; }
.pt.plain { width: 18px; height: 18px; margin: 6px; border-width: 0; }
.pt img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 16%; display: block; border-radius: 50%; }
.pt:hover { transform: scale(1.15); }
.sheet.focus .pt { opacity: .15; }
.sheet.focus .pt.on { opacity: 1; box-shadow: 0 0 0 2px var(--sea-2), 0 0 0 4px var(--c); }
.pip.face { width: 20px; height: 20px; border: 2px solid var(--c); background: var(--sea-3); overflow: hidden; }
.pip.face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 16%; display: block; }
svg.overlay { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

.tip { position: fixed; z-index: 5; pointer-events: none; background: var(--sea); border: 1px solid var(--line); padding: 6px 10px 6px 6px; display: flex; gap: 8px; align-items: center; max-width: 280px; }
.tip .tf { width: 36px; height: 54px; background: var(--sea-3); display: grid; place-items: center; overflow: hidden; flex: none; font: 700 12px var(--display); }
.tip .tf img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tip b { font-family: var(--display); font-size: 14px; display: block; line-height: 1.25; }
.tip span { font-size: 12px; color: var(--muted); }

.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.card { border: 1px solid var(--line); background: var(--sea-2); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 12px; letter-spacing: .12em; color: var(--muted); }
.card h3 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 700; letter-spacing: .03em; line-height: 1.2; }
.card p { margin: 0; }
.hrow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.clear { font: 12px var(--mono); color: var(--muted); background: transparent; border: 1px solid var(--line); padding: 2px 8px; cursor: pointer; }
.clear:hover { color: var(--fg); border-color: var(--muted); }
.alt { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.who { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 12px; align-items: start; }
.portrait { width: 78px; aspect-ratio: 2 / 3; max-width: 100%; border: 1px solid var(--line); background: var(--sea-3); display: grid; place-items: center; overflow: hidden; }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait .mono { font-family: var(--display); font-size: 24px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; }
.card ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.path li b { font-weight: 600; }
.src { font-family: var(--mono); font-size: 12px; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.list { display: flex; flex-wrap: wrap; gap: 6px; }
.list button { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; background: transparent; border: 1px solid var(--line); padding: 3px 8px 3px 6px; cursor: pointer; text-align: left; }
.list button:hover { border-color: var(--muted); }
.list button.relic::before { content: "\25C6"; font-size: 9px; color: var(--muted); margin-right: 4px; }
.tally { display: flex; flex-direction: column; gap: 6px; }
.tally .tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 14px; align-items: center; }
.tally .tb { grid-column: 1 / -1; height: 6px; background: var(--sea-3); display: flex; }
.tally .tb i { display: block; height: 100%; }
.notes { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.foot { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

@media (max-width: 980px) {
  .work { grid-template-columns: 1fr; }
  .panel { position: static; }
  .gloss { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .wrap { padding-inline: 16px; }
  .gloss { grid-template-columns: 1fr; }
  .top { grid-template-columns: 1fr; }
}
</style>

<div class="wrap">

<script>
(() => {
const W = 'https://discoelysium.wiki.gg/wiki/';
const TL = W + 'Timeline_of_Elysium';
const DEV = 'https://discoelysium.com/devblog/2019/11/13/the-political-alignment-system';
const REV = W + 'Revachol';

const IDEO = {
  C: { en: 'Communism', zh: '康米主义', color: '#ece7dc', src: W + 'Communism',
       gloss: { en: 'Revolution for the working class. Its Commune ruled Revachol for years and was crushed in ’08–’10.', zh: '为工人阶级发动革命。它建立的公社曾统治瑞瓦肖多年，’08 至 ’10 年间被镇压。' } },
  F: { en: 'Fascism', zh: '法西斯主义', color: '#a8764c', src: W + 'Fascism',
       gloss: { en: 'Nationalism and monarchy. In Revachol it means wanting the king back; almost no one admits to it.', zh: '民族主义与君主制。在瑞瓦肖指的是盼望国王回来；几乎没人承认自己是。' } },
  M: { en: 'Moralism', zh: '道德主义', color: '#4a86d6', src: W + 'Moralintern',
       gloss: { en: 'The centre: small steps, keep things as they are. Its international Coalition has run the city since ’08.', zh: '中间派：小步改良，维持现状。它的国际联盟自 ’08 年起管理这座城市。' } },
  U: { en: 'Ultraliberalism', zh: '极端自由主义', color: '#d8b03c', src: W + 'Ultraliberal',
       gloss: { en: 'Profit above all. Mixes with any of the others; sided with the communists, then with the moralists.', zh: '利润至上。能与其他任何立场混合；先与康米主义者联手，后与道德主义者合作。' } }
};
const KEYS = ['C', 'F', 'M', 'U'];

// Columns: schematic west-to-east, not real geography.
const COLS = [
  { id: 'out',     w: 1.05, en: 'Outside the city', zh: '城外', kind: 'edge' },
  { id: 'city',    w: 1.0,  en: 'Whole city / place not recorded', zh: '全城 / 位置未载明', kind: 'edge' },
  { id: 'coal',    w: 0.9,  en: 'Coal City', zh: '煤城', side: 'W' },
  { id: 'faub',    w: 0.9,  en: 'Faubourg', zh: '福堡*', side: 'W' },
  { id: 'jam',     w: 0.9,  en: 'Jamrock', zh: '加姆洛克', side: 'W' },
  { id: 'couron',  w: 0.9,  en: 'Grand Couron', zh: '大科戎', side: 'W' },
  { id: 'mart',    w: 3.0,  en: 'Martinaise & harbour', zh: '马丁内斯与港区', side: 'W' },
  { id: 'river',   w: 0.32, en: 'River Esperance', zh: '埃斯佩兰斯河*', kind: 'river' },
  { id: 'delta',   w: 0.9,  en: 'La Delta', zh: '德尔塔', side: 'E' },
  { id: 'stella',  w: 0.9,  en: 'Stella Maris', zh: '斯特拉里斯', side: 'E' },
  { id: 'batiste', w: 0.9,  en: 'Saint-Batiste', zh: '圣巴蒂斯特', side: 'E' },
  { id: 'jardin',  w: 0.9,  en: 'Le Jardin', zh: '勒雅尔丹*', side: 'E' }
];

// Layers, top (street level, now) to bottom (oldest).
const LAYERS = [
  { id: 'G', en: ['Game week', 'March ’51'], zh: ['游戏那一周', '’51 年 3 月'], span: { en: 'one week', zh: '一周' },
    power: ['M', 'U'], mode: 'co', pn: { en: 'Coalition government; liberal-moralist establishment', zh: '联盟政府；自由派—道德主义建制' }, src: W + 'Ultraliberal' },
  { id: 'F', en: ['The Forties', 'the ’40s'], zh: ['四十年代', '’40 年代'], span: { en: '10 years', zh: '十年' },
    power: ['M', 'U'], mode: 'co', pn: { en: 'Coalition government', zh: '联盟政府' }, src: W + 'Moralintern' },
  { id: 'N', en: ['The New', 'the ’30s'], zh: ['“新潮”*', '’30 年代'], span: { en: '10 years', zh: '十年' },
    power: ['M', 'U'], mode: 'co', pn: { en: 'Post-war profit and disco; called an ultraliberal decade', zh: '战后繁荣与迪斯科；被称为极端自由主义的十年' }, src: W + 'Ultraliberal' },
  { id: 'Z', en: ['Zone of Control', '’10 – ’29'], zh: ['控制区时期', '’10 – ’29 年'], span: { en: '20 years', zh: '二十年' },
    power: ['M', 'U'], mode: 'co', pn: { en: 'Coalition occupation; power handed to the liberals. The ’20s: gang war, a botched privatisation, a nuclear pile meltdown in the west.', zh: '联盟占领；权力交给自由派。’20 年代：西区帮派战争、私有化计划失败、核反应堆熔毁。' }, src: TL },
  { id: 'R', en: ['Antecentennial Revolution', '’02 – ’10'], zh: ['世纪大革命', '’02 – ’10 年'], span: { en: '8 years', zh: '八年' },
    power: ['C', 'M'], mode: 'succ', pn: { en: 'Commune from 7 March ’02; Coalition lands 13 May ’08; Revolution ends ’10', zh: '’02 年 3 月 7 日成立公社；’08 年 5 月 13 日联盟登陆；’10 年革命结束' }, src: TL },
  { id: 'K', en: ['The Kingdom', 'founding (~380 yrs before) – ’91 last century'], zh: ['王国时代', '建城（约 380 年前）至上世纪 ’91 年'], span: { en: '~3.5 centuries', zh: '约三个半世纪' },
    power: ['F'], mode: 'solid', pn: { en: 'The Suzerainty: Kings of Revachol', zh: '瑞瓦肖宗主国：历代国王' }, src: W + 'Fascism' }
];

// Who controlled a district in a layer, where the sources say so. ideo: [] = destroyed / no ruler named.
const CLAIMS = [
  { L: 'K', c: 'faub', ideo: ['F'], en: 'Royal fair, ’91', zh: '王室博览会 ’91',
    note: { en: 'The Revachol Fair of ’91 in Faubourg held a parade for King Guillaume’s name-day (René, Timeline).', zh: '’91 年福堡的瑞瓦肖博览会，为纪尧姆国王的命名日举行游行（雷内，时间线）。' }, src: TL },
  { L: 'R', c: 'couron', ideo: ['C'], en: 'Taken early by communards', zh: '革命初期被公社占领',
    note: { en: 'In the first months of the Revolution the communards took most of Couron (Timeline).', zh: '革命最初几个月，公社社员占领了库伦的大部分（时间线）。' }, src: TL },
  { L: 'R', c: 'faub', ideo: ['C'], en: 'People’s Pile begun', zh: '人民堆开工',
    note: { en: 'The People’s Pile reactor was begun under the Commune; the wiki places it in Faubourg (Timeline; Revachol).', zh: '"人民堆"反应堆在公社时期开工；Wiki 把它的位置标在福堡（时间线；Revachol 页）。' }, src: REV },
  { L: 'R', c: 'mart', ideo: ['M'], en: 'Coalition landing ’08', zh: '联盟登陆 ’08',
    note: { en: 'One of three footholds of Operation Deathblow, 13 May ’08 (Timeline).', zh: '"致命一击"行动的三个滩头之一，’08 年 5 月 13 日（时间线）。' }, src: TL },
  { L: 'R', c: 'stella', ideo: ['M'], en: 'Coalition landing ’08', zh: '联盟登陆 ’08',
    note: { en: 'One of three footholds of Operation Deathblow (Timeline).', zh: '"致命一击"行动的三个滩头之一（时间线）。' }, src: TL },
  { L: 'R', c: 'delta', ideo: ['M'], en: 'Coalition landing ’08', zh: '联盟登陆 ’08',
    note: { en: 'One of three footholds of Operation Deathblow (Timeline).', zh: '"致命一击"行动的三个滩头之一（时间线）。' }, src: TL },
  ...['delta', 'stella', 'batiste', 'jardin'].map(c => ({ L: 'Z', c, ideo: ['M'], en: 'East capitulated', zh: '东区投降',

const mix = (hex, pct) => `color-mix(in srgb, ${hex} ${pct}%, transparent)`;

function fill(ideos, pct) {
  if (ideos.length === 1) return mix(IDEO[ideos[0]].color, pct);
  const [x, y] = ideos.map(k => mix(IDEO[k].color, pct));
  return `linear-gradient(${x} 0 50%, ${y} 50% 100%)`;
}
function bar(power) {
  if (!power.length) return 'transparent';
  if (power.length === 1) return IDEO[power[0]].color;
  const [x, y] = power.map(k => IDEO[k].color);
  return `linear-gradient(${x} 0 3px, ${y} 3px 6px)`;
}
function monogram(p) {
  return p.en.replace(/^(The|King)\s+/, '').split(/[\s,(]+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

      const dots = placements.filter(x => x.L === L.id && x.c === c.id)
        .map(x => `<button type="button" class="pt${PORTRAITS[x.p.id] ? '' : ' plain'}" style="--c:${IDEO[x.p.ideo].color}" data-p="${x.p.id}" aria-label="${plain(x.p[lang])}">${PORTRAITS[x.p.id] ? `<img src="${PORTRAITS[x.p.id]}" alt="">` : ''}</button>`).join('');
      const npcs = showNpc && L.id === 'G' && c.id === 'mart' ? NPCS.map(n => `<button type="button" class="pt npc" style="--c:${NPC_GREY}" data-n="${n.id}" aria-label="${n[lang]}"><img src="${NPC_PORTRAITS[n.id]}" alt=""></button>`).join('') : '';
      h += `<div class="${cls}" data-l="${L.id}" data-c="${c.id}" style="--bar:${bar(L.power)};--hl:${hl};${bg}">${dots}${npcs}</div>`;
    });
  });
  grid.innerHTML = h;
}

// ---------- selection ----------
let sel = { type: 'none' };
let showNpc = true;
function applySel() {
  sheet.classList.toggle('focus', sel.type === 'person' || sel.type === 'npc');
  sheet.querySelectorAll('.pt.on, .cell.cur, .rowhead.cur').forEach(el => el.classList.remove('on', 'cur', 'relicsel'));
  if (sel.type === 'person') sheet.querySelectorAll(`.pt[data-p="${sel.id}"]`).forEach(el => el.classList.add('on'));
  if (sel.type === 'npc') sheet.querySelectorAll(`.pt[data-n="${sel.id}"]`).forEach(el => el.classList.add('on'));
  if (sel.type === 'cell') { const el = sheet.querySelector(`.cell[data-l="${sel.L}"][data-c="${sel.c}"]`); if (el) el.classList.add('cur'); }
  if (sel.type === 'layer') { const el = sheet.querySelector(`.rowhead[data-layer="${sel.L}"]`); if (el) el.classList.add('cur'); }
  if (sel.type === 'relic') {
    const th = RELICS[sel.id].thread;
    RELICS.filter(r => r.thread === th).forEach(r => {
      const el = sheet.querySelector(`.cell[data-l="${r.L}"][data-c="${r.c}"]`);
      if (el) el.classList.add('cur', 'relicsel');
    });
  }
  drawOverlay(); renderDetail();
}
function centre(el, box) { const r = el.getBoundingClientRect(); return { x: r.left - box.left + r.width / 2, y: r.top - box.top + r.height / 2 }; }
function drawOverlay() {
  const svg = document.getElementById('overlay');
  let els = [], hue = 'var(--neutral-hl)';
  if (sel.type === 'person') { els = [...sheet.querySelectorAll('.pt.on')]; hue = IDEO[byId[sel.id].ideo].color; }
  if (sel.type === 'relic') {
    const th = RELICS[sel.id].thread;
    els = RELICS.filter(r => r.thread === th).map(r => sheet.querySelector(`.cell[data-l="${r.L}"][data-c="${r.c}"]`)).filter(Boolean);
  }
  if (els.length < 2) { svg.innerHTML = ''; return; }
  const box = sheet.getBoundingClientRect();
  const pts = els.map(el => centre(el, box)).sort((a, b) => b.y - a.y);
  svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
  svg.setAttribute('width', box.width); svg.setAttribute('height', box.height);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  svg.innerHTML = `<path d="${d}" fill="none" stroke="${hue}" stroke-width="1.6" stroke-dasharray="5 4" opacity=".9"/>`;
}

function srcLinks(list) {
  return `<div class="src">${[...new Set(list)].map(s => `<a href="${s}" target="_blank" rel="noopener">${s.replace('https://', '')}</a>`).join('')}</div>`;
}
const where = (L, c) => `${plain(LAYERS[layerIx[L]][lang][0])} · ${plain(COLS[colIx[c]][lang])}`;
const personBtn = p => `<button type="button" data-goto="${p.id}"><span class="dot" style="background:${IDEO[p.ideo].color}"></span>${star(p[lang])}</button>`;
const head = label => `<div class="hrow"><h2>${label}</h2>${sel.type === 'none' ? '' : `<button type="button" class="clear" data-clear>${t('back')}</button>`}</div>`;

function renderDetail() {
  const el = document.getElementById('detail');
  if (sel.type === 'none') {
    const counts = Object.fromEntries(KEYS.map(k => [k, placements.filter(x => x.p.ideo === k).length]));
    const max = Math.max(NPCS.length, ...Object.values(counts));
    const martN = placements.filter(x => x.c === 'mart').length;
    el.innerHTML = `${head(t('overview'))}<p>${t('overviewLead')}</p><p>${t('totalLine')(placements.length, martN)} ${t('npcLine')(NPCS.length)}</p>
      <p class="small">${t('perIdeo')}</p>
      <div class="tally">${KEYS.map(k => `<div class="tr"><span><span class="dot" style="background:${IDEO[k].color}"></span>${IDEO[k][lang]}</span><span class="alt">${counts[k]}</span><div class="tb"><i style="width:${counts[k] / max * 100}%;background:${IDEO[k].color}"></i></div></div>`).join('')}<div class="tr"><span><span class="dot" style="background:${NPC_GREY}"></span>${t('unlabelled')}</span><span class="alt">${NPCS.length}</span><div class="tb"><i style="width:${NPCS.length / max * 100}%;background:${NPC_GREY}"></i></div></div></div>`;
    return;
  }
  if (sel.type === 'person') {
    const p = byId[sel.id];
    const other = lang === 'zh' ? p.en : plain(p.zh);
    const path = (AT[p.id] || []).slice().sort((a, b) => layerIx[b[0]] - layerIx[a[0]])
      .map(a => `<li><b>${where(a[0], a[1])}</b>${a[2] ? C() + a[2][lang] : ''}</li>`).join('');
    const hid = p.hidden ? `<p><b>${p.hidden === 'concealed' ? t('conceals') : t('relabels')}</b> ${p.hiddenNote[lang]}</p>` : '';
    const sec = p.secondary.length ? `<p><b>${t('secondary')}</b>${C()}${p.secondary.map(s => `<span class="dot" style="background:${IDEO[s.ideo].color}"></span>${IDEO[s.ideo][lang]}${CM()}${s[lang]}`).join(SC())}</p>` : '';
    el.innerHTML = `${head(t('person'))}
      <div class="who">
        <div class="portrait">${PORTRAITS[p.id] ? `<img src="${PORTRAITS[p.id]}" alt="${plain(p[lang])}">` : `<span class="mono" style="color:${IDEO[p.ideo].color}">${monogram(p)}</span>`}</div>
        <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
          <div class="chips"><span class="chip" style="border-color:${IDEO[p.ideo].color}"><span class="dot" style="background:${IDEO[p.ideo].color}"></span>${IDEO[p.ideo][lang]}</span></div>
          <h3>${star(p[lang])}</h3><span class="alt">${other}</span>
        </div>
      </div>
      <div><p class="small" style="margin-bottom:4px">${t('whereWhen')}</p><ul class="path">${path}</ul></div>
      <ul>${p.notes[lang].map(n => `<li>${n}</li>`).join('')}</ul>
      ${hid}${sec}${srcLinks(p.src)}`;
    return;
  }
  if (sel.type === 'npc') {
    const n = npcById[sel.id];
    el.innerHTML = `${head(t('npc'))}
      <div class="who"><div class="portrait"><img src="${NPC_PORTRAITS[n.id]}" alt="${n[lang]}"></div>
        <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div class="chips"><span class="chip" style="border-color:${NPC_GREY}"><span class="dot" style="background:${NPC_GREY}"></span>${t('unlabelled')}</span></div>
        <h3>${n[lang]}</h3><span class="alt">${lang === 'zh' ? n.en : n.zh}</span></div></div>
      <p><span class="small">${t('group')}</span> ${NPC_GROUPS[n.g][lang]}</p>
      <p class="small">${t('npcNote')}</p>
      ${srcLinks([n.g === 'rcm' ? TL : W + 'Evrart_Claire'])}`;
    return;
  }
  if (sel.type === 'relic') {
    const r = RELICS[sel.id];
    const chain = RELICS.filter(x => x.thread === r.thread).slice().sort((a, b) => layerIx[b.L] - layerIx[a.L]);
    el.innerHTML = `${head(t('relic'))}<h3>${star(r[lang])}</h3><p class="small">${t('thread')}</p>
      <ul class="path">${chain.map(x => `<li><b>${plain(LAYERS[layerIx[x.L]][lang][0])}</b>${C()}${star(x.note[lang])}</li>`).join('')}</ul>
      ${srcLinks(chain.map(x => x.src))}`;
    return;
  }
  const L = LAYERS[layerIx[sel.L]];
  const rulers = L.power.map(k => `<span><span class="dot" style="background:${IDEO[k].color}"></span>${IDEO[k][lang]}</span>`).join(L.mode === 'succ' ? ` → ${t('then')} ` : ' + ');
  const base = `<p><span class="small">${t('rulers')}</span> ${rulers}</p><p class="small">${L.pn[lang]}</p>`;
  if (sel.type === 'layer') {
    const people = [...new Set(placements.filter(x => x.L === sel.L).map(x => x.p))];
    el.innerHTML = `${head(t('layer'))}<h3>${star(L[lang][0])}</h3><span class="alt">${L[lang][1]} · ${t('span')} ${L.span[lang]}</span>${base}
      <p class="small">${t('inEra')}</p>${people.length ? `<div class="list">${people.map(personBtn).join('')}</div>` : `<p class="small">${t('none')}</p>`}${srcLinks([L.src])}`;
    return;
  }
  // cell
  const claim = CLAIMS.find(x => x.L === sel.L && x.c === sel.c);
  const people = placements.filter(x => x.L === sel.L && x.c === sel.c).map(x => x.p);
  const relics = RELICS.map((r, i) => [r, i]).filter(([r]) => r.L === sel.L && r.c === sel.c);
  el.innerHTML = `${head(t('cell'))}<h3>${star(COLS[colIx[sel.c]][lang])}</h3><span class="alt">${plain(L[lang][0])} · ${L[lang][1]}</span>${base}
    ${claim ? `<p><b>${star(claim[lang])}</b> ${claim.ideo.map(k => `<span class="dot" style="background:${IDEO[k].color}"></span>`).join('')}<br>${claim.note[lang]}</p>` : `<p class="small">${t('claimNone')}</p>`}
    <p class="small">${t('here')}</p>${people.length ? `<div class="list">${people.map(personBtn).join('')}</div>` : `<p class="small">${t('none')}</p>`}
    ${relics.length ? `<p class="small">${t('relicsHere')}</p><div class="list">${relics.map(([r, i]) => `<button type="button" class="relic" data-relic="${i}">${star(r[lang])}</button>`).join('')}</div>` : ''}
    ${srcLinks([L.src].concat(claim ? [claim.src] : []))}`;
}

// ---------- hover tip ----------
const tip = document.getElementById('tip');
sheet.addEventListener('pointerover', ev => {
  const pt = ev.target.closest('.pt'); if (!pt) return;
  if (pt.dataset.n) {
    const n = npcById[pt.dataset.n];
    tip.innerHTML = `<div class="tf"><img src="${NPC_PORTRAITS[n.id]}" alt=""></div><div><b>${n[lang]}</b><span><span class="dot" style="background:${NPC_GREY}"></span>${t('unlabelled')} \u00b7 ${NPC_GROUPS[n.g][lang]}</span></div>`;
    tip.hidden = false; return;
  }
  const p = byId[pt.dataset.p];
  tip.innerHTML = `<div class="tf" style="color:${IDEO[p.ideo].color}">${PORTRAITS[p.id] ? `<img src="${PORTRAITS[p.id]}" alt="">` : monogram(p)}</div><div><b>${star(p[lang])}</b><span><span class="dot" style="background:${IDEO[p.ideo].color}"></span>${IDEO[p.ideo][lang]}</span></div>`;
  tip.hidden = false;
});
sheet.addEventListener('pointermove', ev => {
  if (tip.hidden) return;
  const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = Math.min(ev.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
sheet.addEventListener('pointerout', ev => { if (ev.target.closest('.pt')) tip.hidden = true; });

// ---------- events ----------
sheet.addEventListener('click', ev => {
  const pt = ev.target.closest('.pt');
  if (pt) { sel = pt.dataset.n ? { type: 'npc', id: pt.dataset.n } : { type: 'person', id: pt.dataset.p }; applySel(); return; }
  const row = ev.target.closest('.rowhead');
  if (row) { sel = { type: 'layer', L: row.dataset.layer }; applySel(); return; }
  const cell = ev.target.closest('.cell[data-c]');
  if (cell) { sel = { type: 'cell', L: cell.dataset.l, c: cell.dataset.c }; applySel(); }
});
document.getElementById('detail').addEventListener('click', ev => {
  const g = ev.target.closest('[data-goto]'); if (g) { sel = { type: 'person', id: g.dataset.goto }; applySel(); return; }
  const r = ev.target.closest('[data-relic]'); if (r) { sel = { type: 'relic', id: +r.dataset.relic }; applySel(); return; }
  if (ev.target.closest('[data-clear]')) { sel = { type: 'none' }; applySel(); }
});
document.getElementById('howto').addEventListener('change', ev => {
  if (ev.target.id !== 'optNpc') return;
  showNpc = ev.target.checked;
  if (!showNpc && sel.type === 'npc') sel = { type: 'none' };
  renderGrid(); applySel();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && sel.type !== 'none') { sel = { type: 'none' }; applySel(); } });
function setLang(l) {
  lang = l; try { localStorage.setItem('section-lang', l); } catch (e) {}
  renderHeader(); renderGrid(); applySel();
}
document.getElementById('langZh').addEventListener('click', () => setLang('zh'));
document.getElementById('langEn').addEventListener('click', () => setLang('en'));
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawOverlay, 80); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawOverlay);

renderHeader(); renderGrid(); applySel();
})();
</script>

</body></html>
