tex.encoding=THREE.sRGBEncoding; tex.anisotropy=8;
const mat=new THREE.MeshStandardMaterial({map:tex,roughness:0.7,metalness:0});
const model=new THREE.OBJLoader().parse(document.getElementById('obj').textContent);
model.traverse(o=>{ if(o.isMesh){ o.material=mat; } });
scene.add(model);
const wireMat=new THREE.LineBasicMaterial({transparent:true,opacity:0.55});
const wire=new THREE.Group();
model.traverse(o=>{ if(o.isMesh){ wire.add(new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry),wireMat)); } });
wire.visible=false; scene.add(wire);

// floor grid (5 cm cells) + axis
const grid=new THREE.GridHelper(1.2,24); grid.position.y=-0.0129; scene.add(grid);

// cameras
const persp=new THREE.PerspectiveCamera(35,1,0.01,50);
const ortho=new THREE.OrthographicCamera(-1,1,1,-1,-10,50);
persp.position.set(0.95,0.75,1.15);
const controls=new THREE.OrbitControls(persp,canvas);
controls.target.copy(CENTER); controls.enableDamping=true; controls.dampingFactor=0.09;
controls.minDistance=0.35; controls.maxDistance=6; controls.autoRotateSpeed=1.6;
controls.update();

// fixed orthographic cameras for 4-up
function fixedCam(dir,up){ const c=new THREE.OrthographicCamera(-1,1,1,-1,-10,50); c.position.copy(CENTER).addScaledVector(dir,2); c.up.copy(up); c.lookAt(CENTER); return c; }
const fixed={
  top:fixedCam(new THREE.Vector3(0,1,0),new THREE.Vector3(0,0,-1)),
  bottom:fixedCam(new THREE.Vector3(0,-1,0),new THREE.Vector3(0,0,1)),
  right:fixedCam(new THREE.Vector3(1,0,0),new THREE.Vector3(0,1,0)),
};

const state={ortho:true,quad:true};
function toggle(id,prop,fn){
  const b=document.getElementById(id);
  b.addEventListener('click',()=>{ const v=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',String(v)); fn(v); });
  return b;
}
toggle('b-quad',0,v=>{state.quad=v; layoutOverlays();});
toggle('b-grid',0,v=>grid.visible=v);
toggle('b-wire',0,v=>wire.visible=v);
toggle('b-spin',0,v=>controls.autoRotate=v);
// theme colors
let bgCol=new THREE.Color(), paneCol=new THREE.Color();
function applyTheme(){
  const s=css();
  bgCol.set(s.getPropertyValue('--bg').trim());
  paneCol.set(s.getPropertyValue('--pane').trim());
  const g=new THREE.Color(s.getPropertyValue('--grid').trim());
  grid.material.color=g; grid.material.vertexColors=false; grid.material.needsUpdate=true;
  wireMat.color.set(s.getPropertyValue('--ink').trim());
}
applyTheme();
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme); }catch(e){}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// 4-up layout
const overlays=document.getElementById('overlays');
let W=1,H=1;
function panes(){
  if(!state.quad) return [{cam:'main',x:0,y:0,w:W,h:H,live:true}];
  const side=['top','right'], names={top:'Top',right:'Right'};
  if(W>=H){ // wide: big free view left, small column right
    const sw=Math.max(140,Math.round(Math.min(W*0.26,H/2*1.1))), fw=W-sw, sh=H/2;
    return [{cam:'main',label:'Free',x:0,y:0,w:fw,h:H,live:true}]
      .concat(side.map((c,i)=>({cam:c,label:names[c],x:fw,y:Math.round(i*sh),w:sw,h:Math.round((i+1)*sh)-Math.round(i*sh)})));
  } else { // tall: big free view on top, small row below
    const sh=Math.round(Math.min(H*0.26,W/2)), fh=H-sh, sw=W/2;
    return [{cam:'main',label:'Free',x:0,y:0,w:W,h:fh,live:true}]
      .concat(side.map((c,i)=>({cam:c,label:names[c],x:Math.round(i*sw),y:fh,w:Math.round((i+1)*sw)-Math.round(i*sw),h:sh})));
  }
}
function layoutOverlays(){
  overlays.innerHTML='';
  if(!state.quad) return;
  panes().forEach(p=>{
    if(p.live) return;
    const cell=document.createElement('div'); cell.className='cell';
    cell.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px`;
    const l=document.createElement('div'); l.className='pane-label'; l.textContent=p.label;
    cell.appendChild(l); overlays.appendChild(cell);
  });
}
function resize(){
  W=stage.clientWidth; H=stage.clientHeight;
  renderer.setSize(W,H,false); layoutOverlays();
}
new ResizeObserver(resize).observe(stage); resize();

function fitOrtho(cam,aspect,half){
  cam.left=-half*aspect; cam.right=half*aspect; cam.top=half; cam.bottom=-half; cam.updateProjectionMatrix();
}


function render(){
  requestAnimationFrame(render);
  controls.update();

  // orthographic camera mirrors the perspective one; size matches what persp sees at the target
  const dist=persp.position.distanceTo(controls.target);
  ortho.position.copy(persp.position); ortho.quaternion.copy(persp.quaternion);
  const halfAtTarget=dist*Math.tan(THREE.MathUtils.degToRad(persp.fov/2));

  renderer.setScissorTest(true);
  for(const p of panes()){
    const y=H-p.y-p.h, aspect=p.w/Math.max(1,p.h);
    renderer.setViewport(p.x,y,p.w,p.h); renderer.setScissor(p.x,y,p.w,p.h);
    renderer.setClearColor(state.quad&&p.cam!=='main'?paneCol:bgCol,1);
    let cam;
    if(p.cam==='main'){
      if(state.ortho){ fitOrtho(ortho,aspect,halfAtTarget); cam=ortho; }
      else { persp.aspect=aspect; persp.updateProjectionMatrix(); cam=persp; }
    } else { cam=fixed[p.cam]; fitOrtho(cam,aspect,0.36); }
    grid.visible = document.getElementById('b-grid').getAttribute('aria-pressed')==='true' && !(p.cam==='bottom'||p.cam==='right');
    renderer.render(scene,cam);
  }

}
render();
})();
</script>
